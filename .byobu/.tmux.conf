set -g mouse on

# Set terminal window title to match PS1 format
set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

# Also set window names in byobu
set-option -g automatic-rename on
set -g allow-rename on

# Use vi-style keybindings in copy mode
set -g mode-keys vi

# Copy mouse selection to the system clipboard via /usr/local/bin/tmux-clip,
# which auto-detects the backend at runtime (Wayland -> wl-copy, X11 -> xsel/xclip)
# so one config works on both Wayland and X11 machines. Bind both key tables.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "/usr/local/bin/tmux-clip"
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe "/usr/local/bin/tmux-clip"

# Optional: Keyboard binding for copying with 'y'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "/usr/local/bin/tmux-clip"
bind-key -T copy-mode    y send-keys -X copy-pipe-and-cancel "/usr/local/bin/tmux-clip"

set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

set -g bell-action none

# Disable pane info line (tmux 3.3+)
set -g status-format[1] ""

